<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<title>BonusPortal Admin</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220; --panel: #131c2f; --panel-2: #1a2540; --line: #26324f;
    --ink: #e5e9f5; --muted: #8b97b5; --gold: #f5b301; --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.3rem; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input[type=password] {
    width: 100%; min-height: 52px; padding: 12px 14px; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px;
  }
  .btn { min-height: 48px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 700; }
  .btn.ghost { background: var(--panel-2); border: 1px solid var(--line); }
  .btn.danger { background: transparent; border: 1px solid #7f1d1d; color: #fca5a5; }
  .login { max-width: 360px; margin: 18vh auto 0; display: flex; flex-direction: column; gap: 12px; }
  .err { color: #fca5a5; font-size: .9rem; min-height: 1.3em; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .live { font-size: .75rem; color: var(--muted); }
  .live i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--green); }
  .live.off i { background: var(--red); }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .tile { padding: 12px 8px; text-align: center; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .tile b { display: block; font-size: 1.9rem; line-height: 1.1; }
  .tile span { font-size: .75rem; color: var(--muted); }
  .tile.win b { color: var(--green); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .controls .grow { flex: 1; min-width: 150px; }
  .switch { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .switch input { width: 46px; height: 26px; accent-color: var(--green); }

  .team { margin-bottom: 10px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  .team.done { border-color: #166534; background: linear-gradient(180deg, #112a1f, var(--panel)); }
  .team .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .team .name { font-size: 1.1rem; font-weight: 800; word-break: break-word; }
  .badge { flex: none; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--panel-2); color: var(--muted); }
  .badge.done { background: #14532d; color: #86efac; }
  .badge.live { background: #1e3a8a; color: #93c5fd; }
  .track { height: 8px; margin: 12px 0 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
  .team.done .track i { background: var(--green); }
  .meta { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions .btn { flex: 1; }
  .actions .btn.award.on { background: #14532d; border: 1px solid #166534; color: #bbf7d0; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="login" hidden>
    <h1>🪙 BonusPortal Admin</h1>
    <input type="password" id="pw" placeholder="Admin-Passwort" autocomplete="current-password">
    <button class="btn" id="login-btn">Anmelden</button>
    <div class="err" id="login-err"></div>
  </div>

  <div id="panel" hidden>
    <header>
      <h1>🪙 Bonuspunkt-Übersicht</h1>
      <span class="live" id="live"><i></i><span id="live-text">live</span></span>
    </header>

    <div class="tiles">
      <div class="tile win"><b id="n-done">0</b><span>im Ziel</span></div>
      <div class="tile"><b id="n-run">0</b><span>unterwegs</span></div>
      <div class="tile"><b id="n-all">0</b><span>Teams gesamt</span></div>
    </div>

    <div class="controls">
      <label class="switch grow"><input type="checkbox" id="open"><span id="open-label">Portal offen</span></label>
      <button class="btn danger" id="reset">Alles zurücksetzen</button>
    </div>

    <div id="list"></div>
  </div>
</div>

<script>
"use strict";
const KEY = "bp_admin_pw";
const LABELS = {
  captcha: "Captcha", confirm1: "Erste Nachfrage", confirm2: "Zweite Nachfrage", upsell: "Upgrade-Falle",
  trap: "Fangfrage", queue: "Warteschlange", data: "Identitätsprüfung", hold: "Gedrückt halten",
  final: "Flüchtender Button", error: "Systemfehler", done: "Im Ziel",
};
const $ = (id) => document.getElementById(id);
let pw = "";
let data = null;
let timer = null;

try { pw = sessionStorage.getItem(KEY) || ""; } catch {}

async function call(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { Authorization: "Bearer " + pw, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store",
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401 || res.status === 429 || res.status === 503) throw Object.assign(new Error(json.error), { status: res.status });
  if (!res.ok) throw new Error(json.error || "Fehler " + res.status);
  return json;
}

function showLogin(msg) {
  $("panel").hidden = true;
  $("login").hidden = false;
  $("login-err").textContent = msg || "";
  clearInterval(timer);
}

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString("de-DE");
}
function fmtDur(ms) {
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " min";
}
function ago(ms, now) {
  const s = Math.max(0, Math.round((now - ms) / 1000));
  if (s < 60) return "vor " + s + " s";
  return "vor " + Math.round(s / 60) + " min";
}

function render() {
  const { teams, steps, now, open } = data;
  const finished = teams.filter((t) => t.finished_at).length;
  $("n-done").textContent = finished;
  $("n-run").textContent = teams.filter((t) => !t.finished_at && t.active).length;
  $("n-all").textContent = teams.length;
  $("open").checked = open;
  $("open-label").textContent = open ? "Portal offen" : "Portal geschlossen";

  const list = $("list");
  list.textContent = "";
  if (!teams.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Noch kein Team eingeloggt.";
    list.append(e);
    return;
  }
  const last = steps.length - 1;
  teams.forEach((t, i) => {
    const done = !!t.finished_at;
    const card = document.createElement("div");
    card.className = "team" + (done ? " done" : "");

    const top = document.createElement("div");
    top.className = "top";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = (done ? "#" + (i + 1) + " " : "") + t.team;
    const badge = document.createElement("span");
    badge.className = "badge " + (done ? "done" : t.active ? "live" : "");
    badge.textContent = done ? "✓ im Ziel" : t.active ? "unterwegs" : "abgebrochen";
    top.append(name, badge);

    const track = document.createElement("div");
    track.className = "track";
    const fill = document.createElement("i");
    fill.style.width = Math.max(3, (t.best_step / last) * 100) + "%";
    track.append(fill);

    const meta = document.createElement("div");
    meta.className = "meta";
    const bits = done
      ? ["Ziel um " + fmtTime(t.finished_at), "Dauer " + fmtDur(t.duration_ms)]
      : ["Schritt: " + LABELS[steps[t.current_step]] + " (" + (t.current_step + 1) + "/" + steps.length + ")",
         "weitester: " + LABELS[steps[t.best_step]],
         "aktiv " + ago(t.last_activity, now)];
    bits.push(t.attempts + (t.attempts === 1 ? " Versuch" : " Versuche"));
    bits.forEach((b) => { const s = document.createElement("span"); s.textContent = b; meta.append(s); });

    const actions = document.createElement("div");
    actions.className = "actions";
    if (done) {
      const award = document.createElement("button");
      award.className = "btn ghost award" + (t.awarded ? " on" : "");
      award.textContent = t.awarded ? "✓ Punkt vergeben" : "Punkt vergeben";
      award.onclick = () => act("/api/admin/award", { team_key: t.team_key, awarded: !t.awarded });
      actions.append(award);
    }
    const del = document.createElement("button");
    del.className = "btn danger";
    del.textContent = "Entfernen";
    del.style.flex = done ? "0 0 auto" : "1";
    del.onclick = () => { if (confirm("Team „" + t.team + "“ entfernen?")) act("/api/admin/delete", { team_key: t.team_key }); };
    actions.append(del);

    card.append(top, track, meta, actions);
    list.append(card);
  });
}

async function refresh() {
  try {
    data = await call("/api/admin/overview");
    $("live").classList.remove("off");
    $("live-text").textContent = "live · " + new Date().toLocaleTimeString("de-DE");
    $("login").hidden = true;
    $("panel").hidden = false;
    render();
  } catch (e) {
    if (e.status === 401) return showLogin("Passwort falsch.");
    if (e.status === 429) return showLogin("Zu viele Fehlversuche. Bitte 10 Minuten warten.");
    if (e.status === 503) return showLogin("Admin ist nicht eingerichtet (ADMIN_PASSWORD fehlt).");
    $("live").classList.add("off");
    $("live-text").textContent = "Verbindung weg";
  }
}

async function act(path, body) {
  try { data = await call(path, body); render(); } catch (e) { alert("Fehlgeschlagen: " + e.message); }
}

function start() {
  clearInterval(timer);
  refresh();
  timer = setInterval(() => { if (!document.hidden) refresh(); }, 5000);
}

async function submitLogin() {
  pw = $("pw").value;
  try { sessionStorage.setItem(KEY, pw); } catch {}
  $("login-err").textContent = "";
  start();
}

$("login-btn").onclick = submitLogin;
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });
$("open").onchange = (e) => act("/api/admin/open", { open: e.target.checked });
$("reset").onclick = () => {
  if (confirm("Wirklich ALLE Teams und Ergebnisse löschen?")) act("/api/admin/reset", {});
};

if (pw) start(); else showLogin("");
</script>
</body>
</html>
